# xcodegen spec for the ActionUIDiff add-on.
# Generate the Xcode project with:  xcodegen generate   (run in this directory)
#
# This add-on ships two static libraries. DiffView is the pure diff-viewer component (SwiftUI /
# Foundation only, no ActionUI). ActionUIDiff is the `Diff` element wrapper: it COMPILES AGAINST
# ActionUI's public API but does NOT link the ActionUI static library - the dependency below is
# `link: false`, so ActionUI is used only for its Swift module (build order + import visibility) -
# and depends on DiffView, also `link: false`. The HOST app links ActionUI, DiffView, and this
# add-on, and calls ActionUIDiff.register() once at launch. (A static library never embeds its
# dependencies' object code anyway; link: false makes that intent explicit.)

name: ActionUIDiff

options:
  bundleIdPrefix: com.abracode.actionui
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.6"

packages:
  ActionUI:
    path: ../..        # the ActionUI Swift package at the repo root (Package.swift)

targets:
  DiffView:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/DiffView
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SKIP_INSTALL: "YES"
        PRODUCT_MODULE_NAME: DiffView

  ActionUIDiff:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/ActionUIDiff
    dependencies:
      - target: DiffView
        link: false       # compile-time module dependency only; host links DiffView
      - package: ActionUI
        product: ActionUI
        link: false       # compile-time module dependency only; host links ActionUI
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SKIP_INSTALL: "YES"
        PRODUCT_MODULE_NAME: ActionUIDiff

schemes:
  ActionUIDiff:
    build:
      targets:
        DiffView: all
        ActionUIDiff: all
