# xcodegen spec for the ActionUIDiff add-on.
# Generate the Xcode project with:  xcodegen generate   (run in this directory)
#
# This add-on ships one static library: ActionUIDiff, the `Diff` element wrapper. It COMPILES
# AGAINST ActionUI's public API but does NOT link the ActionUI static library - the dependency
# below is `link: false`, so ActionUI is used only for its Swift module (build order + import
# visibility) - and depends the same way on the DiffView package (the pure diff-viewer component,
# now in its own sibling repo). The HOST app links ActionUI, DiffView, and this add-on, and calls
# ActionUIDiff.register() once at launch. (A static library never embeds its dependencies' object
# code anyway; link: false makes that intent explicit.)

name: ActionUIDiff

options:
  bundleIdPrefix: com.abracode.actionui
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.6"

packages:
  ActionUI:
    path: ../..        # the ActionUI Swift package at the repo root (Package.swift)
  DiffView:
    # The standalone diff-viewer component repo, referenced by github URL to match
    # Package.swift. Resolved from github (network on first resolve, then cached).
    url: https://github.com/abra-code/DiffView
    from: "0.1.0"

targets:
  ActionUIDiff:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/ActionUIDiff
    dependencies:
      - package: DiffView
        product: DiffView
        link: false       # compile-time module dependency only; host links DiffView
      - package: ActionUI
        product: ActionUI
        link: false       # compile-time module dependency only; host links ActionUI
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SKIP_INSTALL: "YES"
        PRODUCT_MODULE_NAME: ActionUIDiff

schemes:
  ActionUIDiff:
    build:
      targets:
        ActionUIDiff: all
