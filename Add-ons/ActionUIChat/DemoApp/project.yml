# xcodegen spec for the ActionUIChat ACP demo app (macOS only).
# Generate + build with:
#   xcodegen generate
#   xcodebuild -project ActionUIChatDemo.xcodeproj -scheme ActionUIChatDemo \
#       -destination 'generic/platform=macOS' build
#
# A dedicated host for the Chat element's ACP transport: launches a real Agent Client
# Protocol agent (OpenCode, claude-code-acp, ...) as a subprocess and hosts the session.
# Dedicated (rather than another ActionUIAddOnTestApp resource) because an ACP document
# is machine-specific (agent binary, working directory) and macOS-only, and because GUI
# apps do not inherit the user's shell PATH - this host resolves the agent command
# through the login shell and generates the Chat document at runtime. See README.md.

name: ActionUIChatDemo

options:
  bundleIdPrefix: com.abracode.actionui
  createIntermediateGroups: true

packages:
  ActionUI:
    path: ../../..
  ActionUIChat:
    path: ..

targets:
  ActionUIChatDemo:
    type: application
    platform: macOS
    deploymentTarget: "14.6"
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: ActionUI
        product: ActionUI              # host links ActionUI core...
      - package: ActionUI
        product: ActionUISwiftAdapter  # ...and the Swift adapter (loadView, action handlers)...
      - package: ActionUIChat
        product: ActionUIChat          # ...and the Chat add-on.
    preBuildScripts:
      - name: "Verify JSON resources"
        script: '"${SRCROOT}/Scripts/verify_json_resources.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.abracode.actionui.ChatDemo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "14.6"
        # Ad-hoc sign so the macOS build runs locally (Apple Silicon requires at least ad-hoc).
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        # The verify-JSON build phase reads the repo (Tools/verifier, Add-ons/*/Schemas) outside
        # the project directory, so keep user-script sandboxing off.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"

schemes:
  ActionUIChatDemo:
    build:
      targets:
        ActionUIChatDemo: all
    run:
      config: Debug
