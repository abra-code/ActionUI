# xcodegen spec for the ActionUIChat add-on.
# Generate the Xcode project with:  xcodegen generate   (run in this directory)
#
# This add-on COMPILES AGAINST ActionUI's public API but does NOT link the ActionUI
# static library: the dependencies below are `link: false`, so ActionUI is used only for
# its Swift module (build order + import visibility). The HOST app is responsible for
# linking ActionUI and this add-on, and for calling ActionUIChat.register() once at launch.
# (A static library never embeds its dependencies' object code anyway; link: false makes
# that intent explicit.)
#
# The chat implementation lives in the standalone ChatView package (a sibling repo of
# ActionUI); this add-on is the thin element wrapper plus per-transport register shims.
# Static-library targets mirror the SPM products: ActionUIChatCore (the Chat element glue,
# re-exporting the ChatView component), ActionUIChatACP (the ACP register shim: "acp" on
# macOS, where the agent is a subprocess, and "acp-remote" everywhere),
# ActionUIChatOpenAI (the OpenAI SSE register shim), and the ActionUIChat umbrella (depends
# on all; its register() wires them). The inter-target dependencies are also link: false -
# each is a static lib the host links; the target dependency exists for build order and
# Swift-module visibility only.

name: ActionUIChat

options:
  bundleIdPrefix: com.abracode.actionui
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.6"

packages:
  ActionUI:
    path: ../..        # the ActionUI Swift package at the repo root (Package.swift)
  ChatView:
    # The standalone chat component repo, referenced by github URL to match Package.swift.
    # Resolved from github (network on first resolve, then cached).
    url: https://github.com/abra-code/ChatView
    from: "0.4.5"

targets:
  ActionUIChatCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/Core
    dependencies:
      - package: ActionUI
        product: ActionUI
        link: false       # compile-time module dependency only; host links ActionUI
      - package: ChatView
        product: ChatView
        link: false       # compile-time module dependency only; host links ChatView
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SKIP_INSTALL: "YES"
        PRODUCT_MODULE_NAME: ActionUIChatCore

  ActionUIChatACP:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/ACP
    dependencies:
      - target: ActionUIChatCore
        link: false       # compile-against the Core module; host links it
      - package: ChatView
        product: ChatViewACP
        link: false       # compile-time module dependency only; host links ChatViewACP
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SKIP_INSTALL: "YES"
        PRODUCT_MODULE_NAME: ActionUIChatACP

  ActionUIChatOpenAI:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/OpenAI
    dependencies:
      - target: ActionUIChatCore
        link: false       # compile-against the Core module; host links it
      - package: ChatView
        product: ChatViewOpenAI
        link: false       # compile-time module dependency only; host links ChatViewOpenAI
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SKIP_INSTALL: "YES"
        PRODUCT_MODULE_NAME: ActionUIChatOpenAI

  ActionUIChat:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/Umbrella
    dependencies:
      - target: ActionUIChatCore
        link: false       # compile-against Core (re-exported); host links it
      - target: ActionUIChatACP
        link: false       # compile-against ACP; host links it
      - target: ActionUIChatOpenAI
        link: false       # compile-against OpenAI; host links it
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SKIP_INSTALL: "YES"
        PRODUCT_MODULE_NAME: ActionUIChat

schemes:
  ActionUIChat:
    build:
      targets:
        ActionUIChatCore: all
        ActionUIChatACP: all
        ActionUIChatOpenAI: all
        ActionUIChat: all
