# XcodeGen spec for the Temperature Converter Apple app (iOS + macOS).
#
# Generate the (committed) .xcodeproj with:  ./generate_xcodeproj.sh
# (or: brew install xcodegen && xcodegen generate)
#
# The generated project is committed so anyone can open and build it without
# installing XcodeGen; rerun the generator only after editing this file.
#
# `platform: [iOS, macOS]` makes XcodeGen emit two targets/schemes,
# TemperatureConverter_iOS and TemperatureConverter_macOS, from the one source
# set (the SwiftUI App lifecycle host runs on both).

name: TemperatureConverter

options:
  bundleIdPrefix: com.abracode.actionui.examples
  deploymentTarget:
    iOS: "17.6"
    macOS: "14.6"
  createIntermediateGroups: true

# The ActionUI Swift package lives at the repo root (three levels up from apple/).
packages:
  ActionUI:
    path: ../../../

targets:
  TemperatureConverter:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: TemperatureConverterApp.swift
      # The shared JSON, copied into the app bundle as TemperatureConverter.json.
      - path: ../shared/TemperatureConverter.json
        buildPhase: resources
    dependencies:
      - package: ActionUI
        product: ActionUI
      - package: ActionUI
        product: ActionUISwiftAdapter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abracode.actionui.examples.TemperatureConverter
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
