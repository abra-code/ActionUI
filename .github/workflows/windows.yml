# Windows: on GitHub-hosted Windows runners, x64 and arm64, with Scripts/ci-windows.py (which also
# runs by hand on a Windows machine): builds ActionUI's portable core and runs its tests, and
# builds the WinUI shim and the Swift package for Windows and runs their smoke tests (C and Swift).
# Each job uploads its logs and summary as an artifact and adds the summary to the run page.
# On WinUI-CI, the branch pre-commit checks run on (rewritten for every check), a failing job is shown
# as failed but does not fail the run, so it sends no failed-run notification; the check reads each
# job's own result.

name: Windows

on:
  push:
    branches: [WinUI]
    paths-ignore: ["**/*.md", "Documentation/**"]
  pull_request:
    branches: [WinUI]
    paths-ignore: ["**/*.md", "Documentation/**"]
  workflow_dispatch:

# The jobs only read the repository; artifacts and the toolchain cache use the runner's own token.
permissions:
  contents: read

# A newer push to the same branch replaces a run that is still going.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            swift_arch: amd64
          - arch: arm64
            runner: windows-11-arm
            swift_arch: arm64
    name: core (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ github.ref_name == 'WinUI-CI' }}
    timeout-minutes: 60
    steps:
      # Test fixtures are compared byte for byte: no CRLF conversion. SwiftPM build paths are deep.
      - name: Git settings
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Swift
        uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.4.2-release
          swift-build: 6.4.2-RELEASE
          build_arch: ${{ matrix.swift_arch }}
          cache: true

      - name: Build and test the core
        run: python Scripts/ci-windows.py core --results ci-results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-core-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results
          if-no-files-found: warn

  winui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            swift_arch: amd64
          - arch: arm64
            runner: windows-11-arm
            swift_arch: arm64
    name: winui (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ github.ref_name == 'WinUI-CI' }}
    timeout-minutes: 45
    steps:
      - name: Git settings
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Swift
        uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.4.2-release
          swift-build: 6.4.2-RELEASE
          build_arch: ${{ matrix.swift_arch }}
          cache: true

      # Installs the Windows App SDK runtime for the runner's user (the smoke tests need it).
      - name: Build the shim and the renderer and run their smoke tests
        run: python Scripts/ci-windows.py winui --install-runtime --results ci-results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-winui-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results
          if-no-files-found: warn
