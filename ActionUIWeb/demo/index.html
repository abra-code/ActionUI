<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ActionUIWeb Demo</title>
    <!-- Material Symbols web font (OFL), with the variable axes ActionUIWeb
         uses (opsz, wght, FILL, GRAD). Self-host for offline use; the .aui-symbol
         class in theme.css references the "Material Symbols Rounded" family. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="../theme.css">
    <style>
        /* The body is the "screen": a definite viewport-sized stage (the scene
           proposal). The window is centered within it and clamps to it via its
           root frame (see Private/ActionUI-Web-Layout-Engine.md); when the
           window's min size exceeds the viewport, the stage scrolls. */
        body {
            margin: 0;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
            background: #d8d8dc;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #1c1c1e; }
        }
        /* Transparent wrapper so the .aui-window is the body's flex item and its
           frame-derived width/height govern the layout directly. */
        #root { display: contents; }
        #root .aui-window {
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./app.js"></script>
</body>
</html>
