<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ActionUIWeb Demo</title>
    <link rel="stylesheet" href="../theme.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #d8d8dc;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #1c1c1e; }
        }
        #root .aui-window {
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
            min-width: 460px;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./app.js"></script>
</body>
</html>
