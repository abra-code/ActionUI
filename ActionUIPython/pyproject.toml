[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "actionui"
version = "0.9.0"
description = "Python bindings for ActionUI: native GUI from Python, SwiftUI on macOS and GTK 4 with libadwaita on Linux"
requires-python = ">=3.8"

# ActionUI and ActionUICAdapter are statically linked into the extension .so.
# Only macOS system frameworks (Foundation, SwiftUI, AppKit) are runtime deps.
# Set ACTIONUI_FRAMEWORKS_DIR before building to point at pre-built static
# .framework bundles, or place them in ./frameworks/ next to this file.
# On Linux the extension links to libActionUI.so from the ActionUI library package
# (ACTIONUI_LIBRARY_DIR, or ./library/), and the build copies the library beside it.

[tool.setuptools]
# Only actionui.py is the installable module; test_native.py is not packaged.
py-modules = ["actionui"]
