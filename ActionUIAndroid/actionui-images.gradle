/**
 * ActionUI shared-image build step. Apply from an Android *application*
 * module's build file - one line, anywhere after the plugins block:
 *
 *   Groovy DSL:  apply from: '<path-to>/actionui-images.gradle'
 *   Kotlin DSL:  apply(from = "<path-to>/actionui-images.gradle")
 *
 * (Written in Groovy on purpose: an applied script plugin compiles against
 * its own classpath, where AGP types are not resolvable to the Kotlin DSL
 * compiler; Groovy dispatches dynamically at runtime, where AGP is present.)
 *
 * Drop image files with their Apple asset-catalog names (the exact strings
 * your JSON uses in `assetName` / `assetImage` / `imageName`) into
 * `<module>/sharedImages/`. For each variant this task generates a res
 * directory where every file is renamed to the `aui_*` discovery convention
 * that `DiscoveringImageRegistry` resolves at runtime:
 *
 *   sharedImages/My Logo.png        -> drawable/aui_my_logo.png
 *   sharedImages/night/My Logo.png  -> drawable-night/aui_my_logo.png
 *   sharedImages/xhdpi/My Logo.png  -> drawable-xhdpi/aui_my_logo.png
 *
 * Subdirectories name the drawable qualifier (anything legal after
 * `drawable-`); top-level files land in plain `drawable/`. The task also
 * emits `raw/actionui_generated_keep.xml` with exact tools:keep entries for
 * the generated names, so resource shrinking keeps precisely these drawables
 * (no wildcard over-keep).
 *
 * The rename transform MUST match `normalizeAssetDrawableName` in the
 * library's `Common/ImageRegistry.kt` (lowercase; any char outside [a-z0-9_]
 * becomes '_'), plus the `aui_` prefix. Both sides are pinned by tests.
 *
 * See `Private/Android_Asset_Image_Design.md` for the design.
 */

import groovy.io.FileType
import org.gradle.api.DefaultTask
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.tasks.InputFiles
import org.gradle.api.tasks.OutputDirectory
import org.gradle.api.tasks.PathSensitive
import org.gradle.api.tasks.PathSensitivity
import org.gradle.api.tasks.SkipWhenEmpty
import org.gradle.api.tasks.TaskAction

abstract class GenerateActionUIImagesTask extends DefaultTask {

    /** The Apple-named source images (flat, or in qualifier subdirectories). */
    @InputFiles
    @SkipWhenEmpty
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getSourceDir()

    /** The generated res directory (wired by AGP via addGeneratedSourceDirectory). */
    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    /** Mirror of Common/ImageRegistry.kt normalizeAssetDrawableName + AUI_DRAWABLE_PREFIX. */
    static String auiResourceName(String appleName) {
        def normalized = appleName.toLowerCase().collect { ch ->
            (ch ==~ /[a-z0-9_]/) ? ch : '_'
        }.join('')
        return 'aui_' + normalized
    }

    @TaskAction
    void generate() {
        File source = sourceDir.get().asFile
        File output = outputDir.get().asFile
        output.deleteDir()

        def keptNames = new TreeSet<String>()
        source.eachFileRecurse(FileType.FILES) { File file ->
            if (file.name.startsWith('.')) return

            // Top-level files -> drawable/; a subdirectory names the qualifier
            // (night, xhdpi, ...) -> drawable-<qualifier>/.
            def relativeDir = source.toPath().relativize(file.parentFile.toPath()).toString()
            def bucket = relativeDir.isEmpty() ? 'drawable'
                : 'drawable-' + relativeDir.replace(File.separatorChar, '-' as char)

            def dotIndex = file.name.lastIndexOf('.')
            def baseName = dotIndex > 0 ? file.name.substring(0, dotIndex) : file.name
            def extension = dotIndex > 0 ? file.name.substring(dotIndex).toLowerCase() : ''
            def resourceName = auiResourceName(baseName)

            def target = new File(output, "$bucket/$resourceName$extension")
            if (target.exists()) {
                throw new GradleException(
                    "ActionUI images: '${file.name}' collides with another source file " +
                    "on the normalized name '$resourceName' in $bucket. Rename one of " +
                    "them or map it explicitly with imageRegistryOf(...)."
                )
            }
            target.parentFile.mkdirs()
            target.bytes = file.bytes
            keptNames.add(resourceName)
        }

        // Exact keep entries for the generated drawables - derived from the same
        // file list, so they cannot drift; no wildcard over-keep.
        if (!keptNames.isEmpty()) {
            def keepFile = new File(output, 'raw/actionui_generated_keep.xml')
            keepFile.parentFile.mkdirs()
            keepFile.text = '<?xml version="1.0" encoding="utf-8"?>\n' +
                '<!-- Generated by actionui-images.gradle - do not edit. -->\n' +
                '<resources xmlns:tools="http://schemas.android.com/tools"\n' +
                '    tools:keep="' + keptNames.collect { "@drawable/$it" }.join(',') + '" />\n'
        }
    }
}

def components = project.extensions.getByName('androidComponents')
components.onVariants(components.selector().all()) { variant ->
    def taskName = 'generateActionUIImages' + variant.name.capitalize()
    def taskProvider = project.tasks.register(taskName, GenerateActionUIImagesTask) {
        it.sourceDir.set(project.layout.projectDirectory.dir('sharedImages'))
        it.description = 'Generates aui_* drawables from sharedImages/ Apple-named files.'
    }
    variant.sources.res.addGeneratedSourceDirectory(
        taskProvider,
        { task -> task.outputDir },
    )
}
